  a.msg .arrow{font-size:1.2rem;opacity:.75}
  .tg{background:var(--tg)}
  .max{background:var(--max)}
  .wa{background:var(--wa)}
  .vk{background:var(--vk)}

  .divider{

    margin:20px 0 14px;color:#8a93a3;font-size:.8rem;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(16,31,58,.1)}

  a.call{

    background:rgba(16,31,58,.05);color:var(--navy);

  a.site{
